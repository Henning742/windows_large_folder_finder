name: build

# This workflow lives at the repository root, which is also where DataFinder.sln sits, so no
# working directory has to be configured: every step runs from the repository root.

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/DataFinder.Core.Tests/DataFinder.Core.Tests.csproj

      - name: Run the unit tests
        run: >
          dotnet test tests/DataFinder.Core.Tests/DataFinder.Core.Tests.csproj
          -c Release --no-restore --logger "console;verbosity=normal"

  windows-app:
    name: Build and publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show the SDK that is in use
        run: dotnet --info

      - name: Restore
        run: dotnet restore DataFinder.sln

      - name: Build
        run: dotnet build DataFinder.sln -c Release --no-restore

      - name: Run the unit tests
        run: dotnet test tests/DataFinder.Core.Tests/DataFinder.Core.Tests.csproj -c Release --no-build

      - name: Publish the app as a single self-contained executable
        run: >
          dotnet publish src/DataFinder.App/DataFinder.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o publish

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: DataFinder-win-x64
          path: publish/
          if-no-files-found: error

